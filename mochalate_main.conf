# vim:set ft=tmux:

# Mochalate - Main Configuration
# Loads the theme and applies all styles.

# ─── Load theme ──────────────────────────────────────────────────────────────

run "tmux source-file $(tmux show -gqv @mochalate-dir)/themes/mochalate.conf"

# ─── Status style ────────────────────────────────────────────────────────────

set -gF status-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
set -g status-justify "left"
set -gF status-interval "#{@mochalate-status-interval}"
set -gF status-left-length "#{@mochalate-status-left-length}"
set -gF status-right-length "#{@mochalate-status-right-length}"

# ─── Status left ─────────────────────────────────────────────────────────────
# Built with set -g (not -F) so formats like #S and #W are stored literally
# and re-expanded by tmux on every redraw (same as status-right below).

set -g status-left ""

%if "#{m:*session*,#{@mochalate-status-left}}"
  set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_accent},#{@mochalate-session-style}] #S "
  set -ag status-left "#[fg=#{@thm_accent},bg=default]"
%endif

%if "#{m:*directory*,#{@mochalate-status-left}}"
  set -ag status-left " #[fg=#{@thm_fg_dim},bg=default] "
  set -ag status-left "#[fg=#{@thm_comment},bg=default,#{@mochalate-directory-style}] #W "
%endif

# ─── Status right ────────────────────────────────────────────────────────────
# Built with set -g (not -F) so format strings like #{cpu_percentage}
# are stored literally for tmux-cpu to replace before rendering.

set -g status-right ""

%if "#{m:*date_time*,#{@mochalate-status-right}}"
  set -ag status-right "#[fg=#{@thm_fg_dim},bg=default,#{@mochalate-date_time-style}] #{T:#{@mochalate-date_time-format}} "
%endif

%if "#{m:*ram*,#{@mochalate-status-right}}"
  set -ag status-right "#[fg=#{@thm_fg_dim},bg=default] "
  set -ag status-right "#[fg=#{@thm_func},bg=default,#{@mochalate-ram-style}] #{ram_icon}#(\$HOME/.config/tmux/plugins/mochalate/tmux/scripts/ram_usage.sh) "
%endif

%if "#{m:*cpu*,#{@mochalate-status-right}}"
  set -ag status-right "#[fg=#{@thm_fg_dim},bg=default] "
  set -ag status-right "#[fg=#{@thm_type},bg=default,#{@mochalate-cpu-style}] #{cpu_icon}#{cpu_percentage} "
%endif

%if "#{m:*application*,#{@mochalate-status-right}}"
  set -ag status-right "#[fg=#{@thm_fg_dim},bg=default] "
  set -ag status-right "#[fg=#{@thm_annotation},bg=default,#{@mochalate-application-style}] #{pane_current_command} "
%endif

# ─── Messages ────────────────────────────────────────────────────────────────

set -gF message-style "fg=#{@thm_fg},bg=#{@thm_bg_menu}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg_menu}"

# ─── Mode ────────────────────────────────────────────────────────────────────

set -gwF mode-style "fg=#{@thm_bg},bg=#{@thm_accent},bold"

# ─── Panes ───────────────────────────────────────────────────────────────────

set -gwF pane-active-border-style "fg=#{@thm_accent}"
set -gwF pane-border-style "fg=#{@thm_border}"
set -gwF pane-border-status "#{@mochalate-pane-border-status}"

# ─── Windows ─────────────────────────────────────────────────────────────────

set -gwF window-status-separator ""
set -gwF window-status-format \
  "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt},#{@mochalate-window-style}] #{@mochalate-window-format} "
set -gwF window-status-current-style "fg=default,bg=default"
set -gwF window-status-current-format \
  "#[fg=#{@thm_accent},bg=default,#{@mochalate-window-current-style}] #{@mochalate-window-current-format} "
set -gwF window-status-activity-style \
  "fg=#{@thm_warn},bg=#{@thm_bg_alt},bold"
set -gwF window-status-bell-style \
  "fg=#{@thm_err},bg=#{@thm_bg_alt},bold"

# ─── Clock ───────────────────────────────────────────────────────────────────

set -gwF clock-mode-colour "#{@thm_accent}"
set -gwF clock-mode-style "#{@mochalate-clock-mode-style}"

# ─── Popups (tmux 3.4+) ────────────────────────────────────────────────────

%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_border_alt}"
%endif

# ─── Display panes ───────────────────────────────────────────────────────────

set -gF display-panes-active-colour "#{@thm_accent}"
set -gF display-panes-colour "#{@thm_border}"
