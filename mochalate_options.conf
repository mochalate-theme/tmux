# vim:set ft=tmux:

# Mochalate - Default Options
# Set these before sourcing the theme to customize.

# Plugin directory (set by options.conf, used by main.conf)
run-shell "tmux set -g @mochalate-dir '#{d:current_file}'"

# Status modules (comma-separated list of enabled modules)
set -ogq @mochalate-status-left "session,directory"
set -ogq @mochalate-status-right "application,cpu,ram,date_time"

# Status separators
set -ogq @mochalate-status-left-separator " "
set -ogq @mochalate-status-right-separator " "

# Status line length
set -ogq @mochalate-status-left-length "40"
set -ogq @mochalate-status-right-length "40"
set -ogq @mochalate-status-interval "5"

# Date/time module format (strftime)
set -ogq @mochalate-date_time-format "%Y-%m-%d %H:%M"

# Clock
set -ogq @mochalate-clock-mode-style "24"

# Window format
set -ogq @mochalate-window-format "#I:#W"
set -ogq @mochalate-window-current-format "#I:#W"
set -ogq @mochalate-window-style ""
set -ogq @mochalate-window-current-style "bold"

# Pane border status
set -ogq @mochalate-pane-border-status "off"

# Tree mode (choose-tree / choose-session, tmux 3.8+) and display-panes borders.
# Values may reference theme colors (e.g. #{@thm_accent}); they are expanded
# after the theme loads.
set -ogq @mochalate-tree-mode-border-style "fg=#{@thm_border_alt},bg=default"
set -ogq @mochalate-tree-mode-preview-style "fg=#{@thm_fg_dim},bg=default"
set -ogq @mochalate-tree-mode-preview-active-style "fg=#{@thm_accent},bg=default"
set -ogq @mochalate-display-panes-border-style "fg=#{@thm_border_alt},bg=default"
